name: Forecast research (paper only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forecast-research.yml'
      - 'scripts/hourly_research.py'
      - 'scripts/data_agent.py'
      - 'tests/test_data_agent.py'
      - 'scripts/backfill_historical.py'
      - 'tests/test_historical_backfill.py'
      - 'tests/test_train_research.py'
      - 'scripts/train_research.py'
      - 'scripts/trend_experiments.py'
      - 'scripts/trend_challenger.py'
      - 'scripts/challenger_shadow.py'
      - 'tests/test_challenger_shadow.py'
      - 'scripts/prospective_trial.py'
      - 'scripts/activate_prospective_trial.py'
      - 'scripts/score_prospective_trial.py'
      - 'tests/test_prospective_trial.py'
      - 'scripts/scenario_stress.py'
      - 'scripts/reward_referee.py'
      - 'scripts/score_rewards.py'
      - 'scripts/learning_status.py'
      - 'scripts/forecast_integrity.py'
      - 'tests/test_forecast_integrity.py'
      - 'tests/test_reward_referee.py'
      - 'scripts/trading_objective.py'
      - 'tests/test_trading_objective.py'
      - 'scripts/teacher_agent.py'
      - 'tests/test_teacher_agent.py'
      - 'scripts/school_project.py'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forecast-research
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect market observations and score matured forecasts
        id: collection
        continue-on-error: true
        run: python scripts/hourly_research.py
      - name: Test Data Agent, history backfill and trainer
        id: unit_tests
        if: steps.collection.outcome == 'success'
        continue-on-error: true
        run: |
          python tests/test_data_agent.py
          python tests/test_historical_backfill.py
          python tests/test_train_research.py
          python tests/test_prospective_trial.py
          python tests/test_challenger_shadow.py
      - name: Incrementally backfill real historical market data
        id: history_backfill
        if: steps.collection.outcome == 'success' && steps.unit_tests.outcome == 'success'
        continue-on-error: true
        run: python scripts/backfill_historical.py
      - name: Audit live and historical evidence
        id: data_agent
        if: steps.collection.outcome == 'success' && steps.unit_tests.outcome == 'success' && steps.history_backfill.outcome == 'success'
        continue-on-error: true
        run: python scripts/data_agent.py
      - name: Run deterministic synthetic scenario suite
        id: scenarios
        if: steps.collection.outcome == 'success'
        continue-on-error: true
        run: python scripts/scenario_stress.py
      - name: Train and validate when enough real history exists
        id: training
        if: steps.collection.outcome == 'success' && steps.unit_tests.outcome == 'success' && steps.history_backfill.outcome == 'success' && steps.data_agent.outcome == 'success'
        continue-on-error: true
        run: python scripts/train_research.py
      - name: Explore Trend feature groups on development folds only
        id: trend_experiments
        if: steps.training.outcome == 'success'
        continue-on-error: true
        run: python scripts/trend_experiments.py
      - name: Freeze development-selected challenger for future shadow comparison
        id: trend_challenger
        if: steps.trend_experiments.outcome == 'success'
        continue-on-error: true
        run: python scripts/trend_challenger.py
      - name: Freeze qualified Trend model for prospective paper trial
        id: trial_activation
        if: steps.training.outcome == 'success' && steps.unit_tests.outcome == 'success' && steps.data_agent.outcome == 'success'
        continue-on-error: true
        run: python scripts/activate_prospective_trial.py
      - name: Score frozen model on prospective forecasts only
        id: trial_score
        if: steps.trial_activation.outcome == 'success' && steps.collection.outcome == 'success'
        continue-on-error: true
        run: python scripts/score_prospective_trial.py
      - name: Test reward referee and score matured forecasts
        id: rewards
        if: steps.collection.outcome == 'success'
        continue-on-error: true
        run: |
          python tests/test_reward_referee.py
          python tests/test_trading_objective.py
          python tests/test_teacher_agent.py
          python tests/test_forecast_integrity.py
          python scripts/forecast_integrity.py
          python scripts/score_rewards.py
          python scripts/teacher_agent.py
          python scripts/school_project.py
      - name: Publish unattended learning readiness
        if: steps.collection.outcome == 'success' && steps.training.outcome == 'success'
        run: python scripts/learning_status.py
      - name: Publish transparent pipeline status
        if: always()
        env:
          COLLECT_RESULT: ${{ steps.collection.outcome }}
          UNIT_TEST_RESULT: ${{ steps.unit_tests.outcome }}
          HISTORY_RESULT: ${{ steps.history_backfill.outcome }}
          DATA_AGENT_RESULT: ${{ steps.data_agent.outcome }}
          SCENARIO_RESULT: ${{ steps.scenarios.outcome }}
          TRAIN_RESULT: ${{ steps.training.outcome }}
          EXPERIMENT_RESULT: ${{ steps.trend_experiments.outcome }}
          CHALLENGER_RESULT: ${{ steps.trend_challenger.outcome }}
          TRIAL_ACTIVATION_RESULT: ${{ steps.trial_activation.outcome }}
          TRIAL_SCORE_RESULT: ${{ steps.trial_score.outcome }}
          REWARD_RESULT: ${{ steps.rewards.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os,json,datetime,pathlib
          p=pathlib.Path('pipeline-status.json')
          def read_report(name):
            try:
              value=json.loads(pathlib.Path(name).read_text())
              return value if isinstance(value,dict) else {}
            except (OSError,ValueError):
              return {}
          historical=read_report('historical-data-report.json')
          data_agent=read_report('data-agent-report.json')
          training=read_report('training-report.json')
          candidate=read_report('candidate-model.json')
          trial_status=read_report('prospective-trial-status.json')
          trial_score=read_report('prospective-trial-report.json')
          historical_quality=data_agent.get('historicalDataQuality') or {}
          status={
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'collection':os.environ.get('COLLECT_RESULT','unknown'),
            'unitTests':os.environ.get('UNIT_TEST_RESULT','unknown'),
            'historicalBackfillStep':os.environ.get('HISTORY_RESULT','unknown'),
            'historicalEvidenceStatus':historical.get('status','MISSING'),
            'historicalAssetsWithHistory':historical.get('assetsWithStoredHistory',0),
            'historicalDailySamples':historical.get('storedObservations',0),
            'dataAgentStep':os.environ.get('DATA_AGENT_RESULT','unknown'),
            'dataAgentAuditStatus':data_agent.get('status','MISSING'),
            'historicalEvidenceAuditStatus':historical_quality.get('status','MISSING'),
            'scenarios':os.environ.get('SCENARIO_RESULT','unknown'),
            'trainingStep':os.environ.get('TRAIN_RESULT','unknown'),
            'trendExperimentsStep':os.environ.get('EXPERIMENT_RESULT','unknown'),
            'trendChallengerStep':os.environ.get('CHALLENGER_RESULT','unknown'),
            'modelTrainingStatus':training.get('status','MISSING'),
            'modelExamples':training.get('examples',0),
            'modelCoins':training.get('uniqueCoins',0),
            'holdoutBrier':training.get('holdoutBrier'),
            'bestConstantBaselineBrier':training.get('bestConstantBaselineBrier'),
            'beatsConstantBaseline':training.get('betterThanConstantBaseline'),
            'candidateModelStatus':candidate.get('status','MISSING'),
            'candidatePromotionEligible':candidate.get('promotionEligible',False),
            'trialActivationStep':os.environ.get('TRIAL_ACTIVATION_RESULT','unknown'),
            'trialStatus':trial_status.get('status','MISSING'),
            'trialModelHash':trial_status.get('modelHash'),
            'trialScoreStep':os.environ.get('TRIAL_SCORE_RESULT','unknown'),
            'prospectiveScoreStatus':trial_score.get('status','MISSING'),
            'prospectiveMaturedForecasts':trial_score.get('maturedForecasts',0),
            'prospectiveDistinctUtcDays':trial_score.get('distinctForecastCreationUtcDays',0),
            'prospectiveBeatsBothBaselines':trial_score.get('beatsBothConstantBaselines'),
            'prospectivePassesProbabilityBenchmark':trial_score.get('passesProbabilityBenchmark',False),
            'automaticModelPromotion':False,
            'realTradingEnabled':False,
            'rewards':os.environ.get('REWARD_RESULT','unknown'),
            'runUrl':os.environ.get('RUN_URL','')
          }
          p.write_text(json.dumps(status,indent=2)+'\n')
          print(status)
          PY
      - name: Commit reports and pipeline status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trend-challenger.json trend-experiment-report.json research-data.json historical-data.json historical-data-report.json data-agent-report.json scenario-report.json training-report.json candidate-model.json prospective-trial-status.json prospective-trial-report.json pipeline-status.json reward-report.json learning-status.json forecast-integrity-report.json teacher-report.json teacher-memory.json school-project.json
          if [ -f prospective-trial.json ]; then git add prospective-trial.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Research: publish scheduled pipeline status"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Fail workflow if research steps failed
        if: always()
        env:
          COLLECT_RESULT: ${{ steps.collection.outcome }}
          UNIT_TEST_RESULT: ${{ steps.unit_tests.outcome }}
          HISTORY_RESULT: ${{ steps.history_backfill.outcome }}
          DATA_AGENT_RESULT: ${{ steps.data_agent.outcome }}
          SCENARIO_RESULT: ${{ steps.scenarios.outcome }}
          TRAIN_RESULT: ${{ steps.training.outcome }}
          EXPERIMENT_RESULT: ${{ steps.trend_experiments.outcome }}
          CHALLENGER_RESULT: ${{ steps.trend_challenger.outcome }}
          TRIAL_ACTIVATION_RESULT: ${{ steps.trial_activation.outcome }}
          TRIAL_SCORE_RESULT: ${{ steps.trial_score.outcome }}
          REWARD_RESULT: ${{ steps.rewards.outcome }}
        run: |
          test "$COLLECT_RESULT" = "success"
          test "$UNIT_TEST_RESULT" = "success"
          test "$HISTORY_RESULT" = "success"
          test "$DATA_AGENT_RESULT" = "success"
          test "$SCENARIO_RESULT" = "success"
          test "$TRAIN_RESULT" = "success"
          test "$EXPERIMENT_RESULT" = "success"
          test "$CHALLENGER_RESULT" = "success"
          test -s trend-challenger.json
          test "$TRIAL_ACTIVATION_RESULT" = "success"
          test "$TRIAL_SCORE_RESULT" = "success"
          test "$REWARD_RESULT" = "success"
