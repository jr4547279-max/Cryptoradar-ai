name: Historical model research (paper only)
on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/historical_research.py'
      - '.github/workflows/historical-research.yml'
permissions:
  contents: write
concurrency:
  group: historical-research
  cancel-in-progress: false
jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download real historical candles and evaluate
        run: python scripts/historical_research.py
      - name: Commit research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historical-training-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Research: update historical model evaluation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
