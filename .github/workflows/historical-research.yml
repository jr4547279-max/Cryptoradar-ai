name: Historical model research (paper only)
on:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/historical_research.py'
      - 'scripts/regime_diagnostics.py'
      - 'scripts/agent_council.py'
      - 'scripts/council_evaluation.py'
      - 'scripts/trainable_council.py'
      - 'scripts/council_robustness.py'
      - 'scripts/council_promotion.py'
      - 'tests/test_research_diagnostics.py'
      - '.github/workflows/historical-research.yml'
permissions:
  contents: write
concurrency:
  group: historical-research
  cancel-in-progress: false
jobs:
  historical-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run research safety and evaluation tests
        run: python tests/test_research_diagnostics.py
      - name: Download real historical candles and evaluate
        run: python scripts/historical_research.py
      - name: Publish research report safely
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the generated report while rebasing against the newest main.
          cp historical-training-report.json "$RUNNER_TEMP/historical-training-report.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/historical-training-report.json" historical-training-report.json
            git add historical-training-report.json
            if git diff --cached --quiet; then
              echo "Historical report already current"
              exit 0
            fi
            git commit -m "Research: update historical model evaluation"
            if git push origin HEAD:main; then
              echo "Historical report published"
              exit 0
            fi
            echo "Concurrent repository update; retrying publication ($attempt/5)"
            sleep $((attempt * 2))
          done
          echo "Unable to publish historical report after retries" >&2
          exit 1
